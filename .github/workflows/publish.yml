name: Publish npm packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in --dry-run mode (no actual publish)'
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NX_DAEMON: false

jobs:
  publish:
    name: Publish three @rytass packages
    runs-on: self-hosted
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prepublish gate (typecheck + lint + test + build + finalize)
        run: pnpm nx run-many -t prepublish-check -p shared,bpm-core,bpm-core-client --parallel 1

      - name: Resolve dist tag
        id: dist_tag
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v*-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @rytass/bpm-core-shared
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: dist/libs/shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG" --provenance

      - name: Publish @rytass/bpm-core-client
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: dist/libs/bpm-core-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG" --provenance

      - name: Publish @rytass/bpm-core-nestjs-module
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: dist/libs/bpm-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG" --provenance

      - name: Dry-run publish (manual trigger with dry_run=true)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: |
          (cd dist/libs/shared && npm publish --dry-run --access public --tag "$DIST_TAG")
          (cd dist/libs/bpm-core-client && npm publish --dry-run --access public --tag "$DIST_TAG")
          (cd dist/libs/bpm-core && npm publish --dry-run --access public --tag "$DIST_TAG")
