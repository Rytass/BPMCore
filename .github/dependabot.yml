version: 2

updates:
  # Security advisories reach this repository mostly through transitive
  # dependencies, which Dependabot cannot bump directly in a pnpm workspace —
  # it can only raise the direct declarations. The `overrides` block in
  # pnpm-workspace.yaml is what actually pins the transitive floors; grouping
  # the direct updates keeps that file from being the only thing anyone
  # remembers to look at.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      nx:
        # The nx package set must move together — a mismatched @nx/* against
        # nx fails to load its executors.
        patterns:
          - nx
          - '@nx/*'
      nest:
        patterns:
          - '@nestjs/*'
      react-and-next:
        patterns:
          - next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - eslint-config-next
          - '@next/eslint-plugin-next'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Published peer ranges are deliberately wide (`typeorm >=0.3.0`,
      # `next >=15.0.0`); a major here is a decision about what hosts must
      # run, not a routine bump.
      - dependency-name: typeorm
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      # The type floor of the oldest Node the libs support (`engines` says
      # >=20). A newer major types APIs Node 20 lacks and drops globals the
      # libs leaned on — @types/node 26 removed `Array.prototype.at` from
      # bpm-core-client's es2021 build (#100). Raise it with `engines`.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Blocked upstream, so every PR for these would sit red:
      # eslint 10 — eslint-plugin-import / -react / -jsx-a11y accept eslint
      # ^9 at most; TypeScript 7 — typescript-eslint needs <6.1 and ts-jest
      # <7; graphql 17 — @apollo/server still requires ^16.11.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: graphql
        update-types: [version-update:semver-major]
      # Pinned exactly to the version react-pdf depends on (see the
      # pdfjs-dist override in pnpm-workspace.yaml); it moves with react-pdf,
      # never on its own.
      - dependency-name: pdfjs-dist

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
