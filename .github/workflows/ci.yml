name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NX_DAEMON: false

jobs:
  verify:
    name: Lint, test, and build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reported but never failing, so the current findings stay visible in
      # every run instead of being suppressed into an allowlist nobody revisits.
      # Two of them (image-size, via @nx/webpack > less) have no published fix
      # at all, so a blocking high gate would be permanently red and would stop
      # meaning anything.
      - name: Audit dependencies (report)
        run: pnpm audit --audit-level moderate || true
        continue-on-error: true

      # Blocking. Nothing critical is outstanding, so this stays green until
      # something genuinely new lands — including an override going stale, which
      # is how the last batch of alerts accumulated.
      - name: Audit dependencies (fail on critical)
        run: pnpm audit --audit-level critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
