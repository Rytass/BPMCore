autoInstallPeers: true
linkWorkspacePackages: true
packages:
  - libs/*

# Security overrides.
#
# Use ranges, never exact pins. An exact pin stops pnpm taking the next patch,
# so an override added to fix one advisory silently becomes the thing holding a
# known-vulnerable version in place — which is exactly how axios/postcss/
# fast-uri/brace-expansion accumulated 29 alerts here. A `^` floor still lets
# the resolver move forward on its own.
overrides:
  # The AI assistant packages, forced to one copy each. `bpm-core-react`'s
  # peers are open (`ai: >=6.0.0`), so `autoInstallPeers` resolved them to the
  # newest major and installed ai 7 / @ai-sdk 4 next to the workspace's own
  # 6 / 3. Raise as one set when the assistant moves to ai 7.
  '@ai-sdk/openai': '^3.0.110'
  '@ai-sdk/provider-utils': '^4.0.33'
  '@ai-sdk/react': '^3.0.281'
  '@babel/core': '^7.29.6'
  '@babel/plugin-transform-modules-systemjs': '^7.29.4'
  '@xhmikosr/decompress': '^11.1.3'
  # Forced to a single copy, for the same reason as typeorm below. The libs
  # publish deliberately open peer ranges (`@nestjs/core: >=10.0.0`) so hosts
  # on Nest 10, 11 or 12 can consume them, and `autoInstallPeers` then resolves
  # those peers to whatever is newest — which quietly installed Nest 12
  # alongside the workspace's own 11 the first time 12 shipped. Two copies give
  # @nestjs/typeorm two unrelated TypeOrmModuleOptions types, exactly the
  # breakage the typeorm override exists to prevent. Raise this block as one
  # set when the workspace moves to Nest 12.
  # Exact, mirroring the app's own pins, for the same reason as pdfjs-dist:
  # `bpm-core-react`'s peer is `>=1.0.0`, so `autoInstallPeers` installed
  # 1.5.1 / 1.2.1 beside the pinned 1.1.0 / 1.0.4. Two copies of a component
  # library mean two React contexts and two stylesheets — the providers stop
  # matching the components rendered under them. Upgrading Mezzanine is a
  # visual-QA change; move these pins with the app's, deliberately.
  '@mezzanine-ui/core': '1.0.4'
  '@mezzanine-ui/react': '1.1.0'
  '@nestjs/apollo': '^13.4.5'
  '@nestjs/common': '^11.2.3'
  '@nestjs/core': '^11.2.3'
  '@nestjs/graphql': '^13.4.5'
  '@nestjs/platform-express': '^11.2.3'
  '@nestjs/testing': '^11.2.3'
  '@nestjs/typeorm': '^11.0.3'
  # One copy: `bpm-core`'s peer is `>=0.4.5` and `autoInstallPeers` installed
  # 0.6.0 beside the app's 0.4.5. It is a NestJS module, so two copies mean two
  # VaultService classes — apps/api injects one into TypeOrmModule.forRootAsync
  # and would get the class from the other tree. Moving to 0.6.0 is a 0.x minor,
  # i.e. a breaking change, and needs a run against real Vault.
  '@rytass/secret-adapter-vault-nestjs': '^0.4.5'
  '@vitest/mocker': '^4.1.11'
  'adm-zip': '^0.6.0'
  'ai': '^6.0.278'
  'axios': '^1.16.0'
  'body-parser@1': '^1.20.6'
  'body-parser@2': '^2.3.0'
  'baseline-browser-mapping': '^2.11.0'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'browserslist': '^4.28.7'
  'fast-uri': '^3.1.6'
  'follow-redirects': '^1.16.0'
  'form-data': '^4.0.6'
  'http-proxy-middleware': '^3.0.6'
  # One copy: `bpm-core`'s peer is `graphql: >=16.0.0`, which `autoInstallPeers`
  # resolved to 17 while every @nestjs/graphql plugin here still expects 16.
  'graphql': '^16.14.2'
  'immutable': '^5.1.8'
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  'launch-editor': '^2.14.1'
  'lodash-es': '^4.18.0'
  'multer': '^2.3.0'
  # Kept to one copy so the eslint config's older next does not become the
  # version bpm-core-react's peer resolves against.
  'next': '^16.3.3'
  'nodemailer': '^9.1.1'
  # The one deliberate exact pin, and it mirrors react-pdf's own: react-pdf
  # depends on `pdfjs-dist: 5.4.296` exactly, while bpm-core-react's peer is
  # `^5.4.296`, so `autoInstallPeers` resolved the peer to 5.7.284 and split the
  # tree in two. Two copies give `PDFDocumentProxy` and react-pdf's
  # `DocumentCallback` unrelated types (pdf-preview.tsx stops compiling) and
  # would ship two PDF workers. Move this with react-pdf, never on its own.
  'pdfjs-dist': '5.4.296'
  'piscina': '^4.9.3'
  'postcss': '^8.5.23'
  'postcss-selector-parser': '^7.1.3'
  'qs@6': '^6.16.0'
  # One copy, and this one is load-bearing. `bpm-core`'s peer is
  # `reflect-metadata: >=0.1.13`, so `autoInstallPeers` installed 0.2.2 beside
  # the workspace's 0.1.14 — which gave @nestjs/core two snapshots differing
  # only by that peer, hence two `ModuleRef` classes, and every module that
  # injects one failed to resolve it. Moving the workspace to 0.2.x is a
  # separate decision (0.x minor is a breaking change); this keeps it at one.
  'reflect-metadata': '^0.1.14'
  'sharp': '^0.35.4'
  'shell-quote': '^1.9.0'
  'svgo@3': '^3.3.5'
  'svgo@4': '^4.1.0'
  'tmp': '^0.2.6'
  # Forced to a single copy. Two typeorm versions give @nestjs/typeorm two
  # structurally identical but unrelated TypeOrmModuleOptions types, and the
  # host app's forRootAsync factory then fails to typecheck.
  'typeorm': '^0.3.31'
  'undici': '^7.28.0'
  'uuid@11': '^11.1.1'
  # Not yet effective, and kept so it becomes effective on its own: vitest is
  # only ever reached as an auto-installed peer of @nx/vite, and pnpm leaves
  # that copy on 4.1.5. `pnpm audit` therefore still reports the moderate
  # @vitest/mocker path-traversal advisory; nothing here runs vitest (jest is
  # the test runner) and the mocker copy itself is patched above.
  'vitest': '^4.1.11'
  'webpack-dev-server': '^5.2.6'
  'websocket-driver': '^0.7.5'
  'ws@7': '^7.5.11'
  'ws@8': '^8.21.0'
  'yaml@>=2.0.0 <2.8.3': '^2.8.3'
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@swc/core'
  - 'less'
  - 'nx'
  - 'sharp'
  - 'unrs-resolver'
