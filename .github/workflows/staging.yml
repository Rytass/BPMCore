name: Staging Server

on:
  push:
    branches: [staging]

jobs:
  tagging:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tagging.outputs.tag }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - id: tagging
        uses: anothrNick/github-tag-action@1.69.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: main
          WITH_V: true
          FORCE_WITHOUT_CHANGES: true
          RELEASE_BRANCHES: release

  build:
    runs-on: self-hosted
    needs: tagging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/bpm-core/api:${{ needs.tagging.outputs.tag }}
          build-args: TARGET=api

      - name: Build Client
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/bpm-core/client:${{ needs.tagging.outputs.tag }}
          build-args: TARGET=client

  update-deployments:
    runs-on: self-hosted
    needs: [tagging, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GAR_JSON_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update GKE
        env:
          IMAGE_TAG: ${{ needs.tagging.outputs.tag }}
          API_IMAGE: asia-east1-docker.pkg.dev/develop-server/bpm-core/api
          CLIENT_IMAGE: asia-east1-docker.pkg.dev/develop-server/bpm-core/client
        run: |-
          gcloud components install kubectl
          gcloud container clusters get-credentials rytass-cluster --region asia-east1 --project develop-server
          sed -i "s|bpm-core/api:v0.0.0|bpm-core/api:$IMAGE_TAG|g" tools/deployment-staging.yml
          sed -i "s|bpm-core/client:v0.0.0|bpm-core/client:$IMAGE_TAG|g" tools/deployment-staging.yml
          kubectl apply -f tools/deployment-staging.yml
          kubectl rollout status deployment/bpm-core -n bpm-core-staging --timeout=300s
