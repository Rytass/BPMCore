services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_PASSWORD: bpm
      POSTGRES_USER: bpm
    ports:
      - '5432:5432'
    volumes:
      - bpm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpm -d bpm']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2026-04-11T23-36-07Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: bpm
      MINIO_ROOT_PASSWORD: bpm-password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - bpm-minio-data:/data

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bpm-postgres-data:
  bpm-minio-data:
