apiVersion: v1
kind: Secret
metadata:
  name: vault-secret
  namespace: bpm-core-staging
type: Opaque
stringData:
  VAULT_HOST: https://vault.rytass.org
  VAULT_ACCOUNT: bpm-core-staging
  VAULT_PASSWORD: <vault-userpass-password>
  VAULT_PATH: bpm_core/staging
  API_SESSION_SECRET: <64-char-session-secret>
  BPM_API_PUBLIC_URL: https://bpm-core-staging.rytass.info
  BPM_ATTACHMENT_SIGNING_SECRET: <64-char-attachment-url-secret>
