# Legacy optional sandbox only.
#
# Normal BPMCore development uses Vault-backed develop secrets and the
# bpm_core_develop Cloud SQL schema. This compose stack is not part of the
# standard dev, test, staging, or attachment flow.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpm
      POSTGRES_PASSWORD: bpm
      POSTGRES_USER: bpm
    ports:
      - '5432:5432'
    volumes:
      - bpm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpm -d bpm']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bpm-postgres-data:
