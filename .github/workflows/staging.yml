name: Staging Server

on:
  push:
    branches: [staging]

jobs:
  # The image tag is the release tag `nx release` already put on this commit
  # (v0.17.7), else `sha-<short sha>`. No tag is created here: a bumped tag
  # would take the version the next `nx release` needs. Tags are read from the
  # remote, not the runner's workspace, which keeps stale local tags.
  tagging:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tagging.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: tagging
        env:
          SHA: ${{ github.sha }}
        run: |-
          tag=$(git ls-remote --tags origin \
            | awk -v sha="$SHA" '$1 == sha { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          tag=${tag:-sha-${SHA::7}}
          echo "Image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: self-hosted
    needs: tagging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/bpm-core/api:${{ needs.tagging.outputs.tag }}
          build-args: TARGET=api

      - name: Build Client
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/bpm-core/client:${{ needs.tagging.outputs.tag }}
          build-args: TARGET=client

  update-deployments:
    runs-on: self-hosted
    needs: [tagging, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GAR_JSON_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update GKE
        env:
          IMAGE_TAG: ${{ needs.tagging.outputs.tag }}
          API_IMAGE: asia-east1-docker.pkg.dev/develop-server/bpm-core/api
          CLIENT_IMAGE: asia-east1-docker.pkg.dev/develop-server/bpm-core/client
        run: |-
          gcloud components install kubectl
          gcloud container clusters get-credentials rytass-cluster --region asia-east1 --project develop-server
          sed -i "s|bpm-core/api:v0.0.0|bpm-core/api:$IMAGE_TAG|g" tools/deployment-staging.yml
          sed -i "s|bpm-core/client:v0.0.0|bpm-core/client:$IMAGE_TAG|g" tools/deployment-staging.yml
          kubectl apply -f tools/deployment-staging.yml
          kubectl rollout status deployment/bpm-core -n bpm-core-staging --timeout=300s
