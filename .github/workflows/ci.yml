name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NX_DAEMON: false

jobs:
  verify:
    name: Lint, test, and build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reported but never failing, so the current findings stay visible in
      # every run instead of being suppressed into an allowlist nobody revisits.
      # Two of them (image-size, via @nx/webpack > less) have no published fix
      # at all, so a blocking high gate would be permanently red and would stop
      # meaning anything.
      - name: Audit dependencies (report)
        run: pnpm audit --audit-level moderate || true
        continue-on-error: true

      # Blocking. Nothing critical is outstanding, so this stays green until
      # something genuinely new lands — including an override going stale, which
      # is how the last batch of alerts accumulated.
      - name: Audit dependencies (fail on critical)
        run: pnpm audit --audit-level critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The self-hosted runners OOM-kill jest workers: nx runs several
      # projects' jest instances at once and each opens its own worker pool, so
      # the peak is the product of both. Capped at one project at a time with
      # two workers inside each jest. Three consecutive runs died here with up
      # to 91 SIGKILLs and 0 failing tests before this cap.
      #
      # Must be called through nx directly, NOT as `pnpm test -- --parallel=1`:
      # the `--` makes nx forward the flag to each executor instead of
      # consuming it, and the inferred test targets (shared, api, client) fail
      # on the unknown argument.
      #
      # Nest 12 is ESM, and jest loads it only under --experimental-vm-modules.
      # The root .env.test sets that, but nx never overrides a variable the
      # environment already has, and this self-hosted runner arrives with its
      # own NODE_OPTIONS, so the flag is appended here instead.
      - name: Test
        run: |
          NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--experimental-vm-modules" \
            pnpm exec nx run-many -t test --parallel=1 --maxWorkers=2

      - name: Build
        run: pnpm build
